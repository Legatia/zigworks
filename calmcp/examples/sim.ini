; The made-up owner's calendars of calmcp-sim:
;   calmcp-sim 8742 owner not-a-real-password &
;   CALDAV_PASSWORD=not-a-real-password calmcp check examples/sim.ini
; For a real account, let calmcp write the file:
;   CALDAV_PASSWORD=APP-PASSWORD calmcp discover https://caldav.fastmail.com you@fastmail.com > calendar.ini
; (iCloud: https://caldav.icloud.com, Nextcloud: https://HOST/remote.php/dav),
; read it through, and set change = yes only where calmcp may make changes.

[account]
url = http://127.0.0.1:8742
user = owner
auth = password
zone = Europe/Warsaw
email = owner@example.com

[calendar personal]
url = /dav/calendars/owner/personal/
name = Personal
change = yes

[calendar work]
url = /dav/calendars/owner/work/
name = Work
change = yes

[calendar birthdays]
url = /dav/calendars/owner/birthdays/
name = Birthdays
