name: Release

# Push a tag named <project>-v<version>, e.g. `trigrep-v0.2.0` or `headterm-v0.2.0`.
# Builds static Linux binaries (x86_64, arm64) and an Apple Silicon macOS binary, and
# attaches them to a GitHub release for that tag.
on:
  push:
    tags: ["trigrep-v*", "headterm-v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-linux-musl, name: x86_64-linux }
          - { os: ubuntu-latest, target: aarch64-linux-musl, name: aarch64-linux }
          # Zig 0.15.1 can't link against the macOS 26 SDK on macos-latest; macos-15 works.
          # Native build: an explicit -Dtarget would make Zig treat it as a cross
          # build and not find the SDK frameworks trigrep links (CoreServices).
          # -Dcpu=apple_m1 keeps the binary runnable on every Apple Silicon Mac.
          - { os: macos-15, target: native, name: aarch64-macos }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.15.1
      - name: Build
        shell: bash
        run: |
          project="${GITHUB_REF_NAME%%-v*}"
          version="${GITHUB_REF_NAME#*-v}"
          case "$project" in trigrep|headterm) ;; *) echo "unknown project in tag: $project"; exit 1 ;; esac
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "bad version in tag: $version"; exit 1; }
          grep -q "\"$version\"" "$project/build.zig.zon" || { echo "tag version $version not in $project/build.zig.zon"; exit 1; }
          cd "$project"
          zig build test
          if [ "${{ matrix.target }}" = native ]; then target_flag=-Dcpu=apple_m1; else target_flag=-Dtarget=${{ matrix.target }}; fi
          zig build -Doptimize=ReleaseFast -Dstrip=true $target_flag --prefix out
          pkg="$project-$version-${{ matrix.name }}"
          mkdir "$pkg"
          cp out/bin/"$project" README.md LICENSE "$pkg"/
          tar czf "$pkg.tar.gz" "$pkg"
          shasum -a 256 "$pkg.tar.gz" > "$pkg.tar.gz.sha256"
          echo "PKG_DIR=$project" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ env.PKG_DIR }}/*.tar.gz
            ${{ env.PKG_DIR }}/*.tar.gz.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --generate-notes
