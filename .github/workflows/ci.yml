name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # macos-15: Zig 0.15.1 couldn't link against the macOS 26 SDK on macos-latest.
        # Not tried again with Zig 0.17.1.
        os: [ubuntu-latest, macos-15]
        project: [trigrep, headterm, headsight, headsound, llmcheck, keygate, harness, homemcp, carcloud, mailmcp, calmcp]
        # GitHub gives this account few macOS runners at once, and jobs that
        # wait ~15 min for one are cancelled: homemcp, carcloud, mailmcp and
        # calmcp (checked on a Mac by hand; their macOS code is the libc link)
        # run on Linux and Windows only, leaving the macOS runners to the rest
        exclude:
          - { os: macos-15, project: homemcp }
          - { os: macos-15, project: carcloud }
          - { os: macos-15, project: mailmcp }
          - { os: macos-15, project: calmcp }
        include:
          # Windows: everything but headsight (headsound's file commands, for
          # GoldWave users; headterm on ConPTY)
          - { os: windows-latest, project: headsound }
          - { os: windows-latest, project: trigrep }
          - { os: windows-latest, project: headterm }
          # Linux only: it is a Wayland display server
          - { os: ubuntu-latest, project: headdesk }
          - { os: ubuntu-24.04-arm, project: headdesk }
          - { os: windows-latest, project: llmcheck }
          - { os: windows-latest, project: keygate }
          - { os: windows-latest, project: harness }
          - { os: windows-latest, project: homemcp }
          - { os: windows-latest, project: carcloud }
          - { os: windows-latest, project: mailmcp }
          - { os: windows-latest, project: calmcp }
          # Linux only: SocketCAN
          - { os: ubuntu-latest, project: canmcp }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ${{ matrix.project }}
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.17.1
      # headdesk's boxes need user namespaces, which Ubuntu's runners restrict
      - if: matrix.project == 'headdesk'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      # harness's Linux sandboxes are bubblewrap, which needs user namespaces
      # (restricted on Ubuntu's runners, as for headdesk); its remote tests
      # start a sshd of their own on 127.0.0.1
      - if: matrix.project == 'harness' && runner.os == 'Linux'
        run: |
          sudo apt-get update -q && sudo apt-get install -y --no-install-recommends bubblewrap openssh-server
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      # homemcp's Zigbee2MQTT checks need a broker; they are skipped without one
      - if: matrix.project == 'homemcp' && runner.os == 'Linux'
        run: sudo apt-get install -y -qq --no-install-recommends mosquitto
      # canmcp's bus checks need vcan0; they are skipped without it
      - if: matrix.project == 'canmcp'
        run: sudo modprobe vcan && sudo ip link add dev vcan0 type vcan && sudo ip link set up vcan0 || echo "no vcan on this runner"
      - run: |
          set -o pipefail
          zig build test --summary all 2>&1 | tee "$RUNNER_TEMP/test.log"
      # The log can't be read without signing in; annotations can. Put the
      # lines of a failed run that say what failed onto the run.
      - if: failure()
        run: |
          grep -a -E "FAIL|failed|expected|error:|no '" "$RUNNER_TEMP/test.log" | grep -v "^::error::" | head -12 | while IFS= read -r line; do
            echo "::error::${{ matrix.project }}: ${line:0:500}"
          done
      # Optimized code with safety checks on: catches overflow that only shows
      # up after optimization (headsight's diff did, on Zig 0.15.1 and 0.17.1).
      - run: zig build test -Doptimize=ReleaseSafe
      - run: zig build -Doptimize=ReleaseFast

  # harness-desk, the desk's macOS app: the one piece built with the
  # system's own libraries (Cocoa, WebKit), so it has a job of its own. Its
  # unit tests, one bundle for Apple Silicon and Intel Macs signed ad hoc,
  # and the smoke in a window against a stand-in harness (it says SKIP when
  # the runner's session has no window server).
  desk-app-macos:
    runs-on: macos-15
    defaults:
      run:
        working-directory: harness/desk-app
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.17.1
      - run: |
          set -o pipefail
          zig build test --summary all 2>&1 | tee "$RUNNER_TEMP/test.log"
      - run: zig build test -Doptimize=ReleaseSafe
      # the fit files are left out here: no network, and the base head may
      # not be in the repository yet (the release packs them, strictly)
      - run: DESK_ASSETS=none scripts/package-macos.sh 0.0.0 "$RUNNER_TEMP/harness-desk-ci-macos.zip"
      # the smoke's setup runs once against the stand-in and once against
      # this harness (a data folder and secrets of its own, no model called)
      - run: |
          set -o pipefail
          (cd .. && zig build)
          DESK_SMOKE_HARNESS="$PWD/../zig-out/bin/harness" zig build smoke 2>&1 | tee -a "$RUNNER_TEMP/test.log"
      - if: failure()
        run: |
          grep -a -E "not ok|FAIL|failed|error:" "$RUNNER_TEMP/test.log" | grep -v "^::error::" | head -12 | while IFS= read -r line; do
            echo "::error::desk-app: ${line:0:500}"
          done

  # The desk app for Windows: unit tests, the program with Microsoft's
  # WebView2 loader beside it (the NuGet package pinned by version and
  # SHA-256 in scripts/fetch-webview2.sh), packaged, and the smoke in a
  # window against a stand-in harness.
  desk-app-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: harness/desk-app
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.17.1
      - run: |
          set -o pipefail
          zig build test --summary all 2>&1 | tee "$RUNNER_TEMP/test.log"
      - run: zig build test -Doptimize=ReleaseSafe
      - run: scripts/fetch-webview2.sh "$RUNNER_TEMP/webview2"
      - run: scripts/package-windows.sh 0.0.0 "$RUNNER_TEMP/harness-desk-ci-windows.zip" "$RUNNER_TEMP/webview2"
      # the web view itself is Windows' own, from Microsoft: installed here
      # when the runner's image lacks it (the smoke says SKIP without it)
      - name: WebView2 Runtime, where the runner has none
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          if (Test-Path $key) { "already there: $((Get-ItemProperty $key).pv)"; exit 0 }
          $setup = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebview2Setup.exe'
          Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $setup
          $sig = Get-AuthenticodeSignature $setup
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') { throw "the installer isn't signed by Microsoft: $($sig.Status)" }
          Start-Process -FilePath $setup -ArgumentList '/silent', '/install' -Wait
      - run: |
          set -o pipefail
          zig build smoke -Dwebview2="$RUNNER_TEMP/webview2" 2>&1 | tee -a "$RUNNER_TEMP/test.log"
      - if: failure()
        run: |
          grep -a -E "not ok|FAIL|failed|error:" "$RUNNER_TEMP/test.log" | grep -v "^::error::" | head -12 | while IFS= read -r line; do
            echo "::error::desk-app (Windows): ${line:0:500}"
          done

  # The desk app for Linux: unit tests, the program linked against the
  # system's GTK 3 and WebKitGTK 4.1, packaged, and the smoke under Xvfb.
  desk-app-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: harness/desk-app
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.17.1
      # WebKitGTK starts its web process in a bubblewrap sandbox, which needs
      # user namespaces (restricted on Ubuntu's runners, as for harness)
      - run: |
          sudo apt-get update -q && sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev xvfb
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: |
          set -o pipefail
          zig build test --summary all 2>&1 | tee "$RUNNER_TEMP/test.log"
      - run: zig build test -Doptimize=ReleaseSafe
      - run: scripts/package-linux.sh 0.0.0 "$RUNNER_TEMP/harness-desk-ci-linux-x86_64.tar.gz"
      - run: |
          set -o pipefail
          GDK_BACKEND=x11 zig build smoke 2>&1 | tee -a "$RUNNER_TEMP/test.log"
      - if: failure()
        run: |
          grep -a -E "not ok|FAIL|failed|error:" "$RUNNER_TEMP/test.log" | grep -v "^::error::" | head -12 | while IFS= read -r line; do
            echo "::error::desk-app (Linux): ${line:0:500}"
          done
