; The made-up car of carcloud-sim:
;   carcloud-sim 8740 not-a-real-secret &
;   SMARTCAR_CLIENT_SECRET=not-a-real-secret carcloud check examples/sim.ini
; For a real car: connect it through Smartcar Connect once (scopes: read_battery
; read_charge read_security read_odometer read_thermometer control_charge
; control_security, and read_location if `location = yes`), then put its
; vehicle and user ids here, drop `api` and `token_url`, and give carcloud the
; application's secret as SMARTCAR_CLIENT_SECRET. Smartcar's free plan
; allows no commands; reading works.

[car]
name = The made-up car
vehicle_id = 0c5f52b4-6a39-4a66-b2bd-6fdc1a5c8b11
user_id = 5a2b7c1e-sim-user
client_id = sim-client
api = http://127.0.0.1:8740/v3
token_url = http://127.0.0.1:8740/oauth2/token
allow = charge_start, charge_stop, charge_limit, lock
charge_limit = 60 90
commands_per_day = 10
min_seconds_between = 60
location = no
