; A Tesla through Tesla's Fleet API, with your own developer application
; (developer.tesla.com; README: With a Tesla). Once:
;   1. tesla-keygen makes the application's key; its public half goes on
;      your domain; the owner pairs it in the Tesla app (tesla.com/_ak/DOMAIN)
;   2. tesla-http-proxy runs beside carcloud and signs commands
;   3. TESLA_CLIENT_SECRET=... carcloud login tesla.ini
; Then carcloud tesla.ini needs no secret: it renews the sign-in itself.

[car]
backend = tesla
name = The Model 3
vin = 5YJ3E7EB0KF000000          ; carcloud login lists your cars
client_id = 0a1b2c3d-...          ; your application's client id
redirect_uri = https://example.com/callback   ; one your application lists
region = eu                       ; eu, na (North America, Asia-Pacific) or cn
command_api = https://localhost:4443          ; tesla-http-proxy
command_ca = proxy-cert.pem       ; its certificate (made with it)
allow = climate, seat_heat, charge_start, charge_stop, charge_limit
climate_temp = 18 24              ; the temperatures the agent may set, °C
charge_limit = 60 90
commands_per_day = 10
min_seconds_between = 60
wakes_per_day = 3                 ; car_status may wake the car this often
location = no
log = carcloud.jsonl
