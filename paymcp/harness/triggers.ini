; Add this section to the triggers.ini in your harness data folder: a
; reading every Monday at 09:00, told to you where harness talks to you.
; "harness trigger run billing-audit" runs it once now.

[billing-audit]
at = 09:00
days = mon
do = Run billing_audit with fresh set to true. Then tell me in a few plain lines: what is new since the last reading and what is no longer found, each with its amount, then the three largest open findings with what is proposed. If nothing changed, say so in one line. Decide nothing yourself.

; With a [ledger] section in the pay file: the books read every working
; day, so that a supplier's changed bank details are seen the next
