; Add this section to the mcp.ini in your harness data folder.
; The name must stay "billing": the Money page and the rules use it.
; The key is in harness's key store ("harness secret add stripe"), and
; paymcp gets it in its environment; it is in no file.

[billing]
command = /path/to/paymcp /path/to/pay.ini
secret = STRIPE_KEY:stripe

; The other readers have keys of their own. A section has one secret
; line: name every key you use on it, with commas between, each stored
; with "harness secret add NAME". For the books (the pay file's
; [ledger]): XERO_CLIENT_ID:xero-id, XERO_CLIENT_SECRET:xero-secret. For
; the bill watch ([bills]): ANTHROPIC_ADMIN_KEY:anthropic-admin,
; OPENAI_ADMIN_KEY:openai-admin, AWS_ACCESS_KEY_ID:aws-id,
; AWS_SECRET_ACCESS_KEY:aws-secret. As:
;; secret = STRIPE_KEY:stripe, XERO_CLIENT_ID:xero-id, XERO_CLIENT_SECRET:xero-secret, ANTHROPIC_ADMIN_KEY:anthropic-admin

; To let paymcp change things (the pay file must also say [changes]
; allow = yes): store the second key with "harness secret add
; stripe-write", delete the secret line above (a section has one), and
; take the ";; " off the lines below. Declared as money tools, the two
; tools that change things are asked every time, whatever the rules say,
; never run from a schedule unasked, and can't be called by the page.
; max_per_call is in the currency's smallest unit (50000: 500.00).
;; secret = STRIPE_KEY:stripe, STRIPE_WRITE_KEY:stripe-write
;; money = billing_change, dispute_stage
;; amount = billing_change:amount, dispute_stage:none
;; max_per_call = 50000
