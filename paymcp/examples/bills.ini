; The bill watch tried against the stand-in (no account is needed):
;   paymcp-sim 8743 rk_test_sim --cloud admin_sim
;   ANTHROPIC_ADMIN_KEY=admin_sim OPENAI_ADMIN_KEY=admin_sim \
;   AWS_ACCESS_KEY_ID=AKIASIMSIMSIMSIMSIM0 AWS_SECRET_ACCESS_KEY=admin_sim \
;     paymcp bills examples/bills.ini
; For your own accounts: take the three *_url lines out and give the keys
; you have (README, The bill watch). The keys are never in this file.

[bills]
; which are read: anthropic, openai, aws (one with no key is said, and left out)
read = anthropic, openai, aws
; the month's budget for everything read, in cents
budget = 150000
; days = 35
; jump = 3
; jump_above = 500
; doubled_above = 1000
; currency = usd
anthropic_url = http://127.0.0.1:8743
openai_url = http://127.0.0.1:8743
aws_url = http://127.0.0.1:8743
