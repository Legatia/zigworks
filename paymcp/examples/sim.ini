; The made-up business of paymcp-sim:
;   paymcp-sim 8743 rk_test_not_a_real_key &
;   STRIPE_KEY=rk_test_not_a_real_key paymcp audit examples/sim.ini
; For a real account: leave url out (it is then https://api.stripe.com), keep
; mode = sandbox until the report reads right, and make a restricted key
; that can only read (README, The key).

[stripe]
url = http://127.0.0.1:8743
mode = sandbox

[billing]
; the business's own list of who has what (README, The business's own file)
who = who.csv

[letters]
; who a drafted message to a customer is from
from = Ola at Fernhill

[plans]
; a plan's name in who.csv = the price it means (a price's id or lookup key)
team = team_monthly
pro = pro_monthly
