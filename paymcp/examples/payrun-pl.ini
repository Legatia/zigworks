; The payment-run check with the two Polish readers, on made-up files
; (examples/payrun-pl/), tried against the stand-in:
;   paymcp-sim 8743 rk_test_sim
;   paymcp payrun examples/payrun-pl.ini check examples/payrun-pl/run-2026-12-01.csv
; For your own payments: take the whitelist_url line out, and the tax
; office's own list is asked (README, Poland).

[payrun]
suppliers = payrun-pl/suppliers.csv
currency = pln
; a folder of KSeF invoice files (XML): each payment is set beside its invoice
invoices = payrun-pl/ksef
; yes: each account is asked about at the tax office's list of VAT payers.
; That sends each supplier's tax number and account there.
whitelist = yes
whitelist_url = http://127.0.0.1:8743
