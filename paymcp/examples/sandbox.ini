; For a Stripe sandbox filled by scripts/seed-sandbox.py:
;   STRIPE_KEY=rk_test_... paymcp check examples/sandbox.ini
;   STRIPE_KEY=rk_test_... paymcp audit examples/sandbox.ini
; (README, Against a Stripe sandbox). The key: a restricted key of that
; sandbox that can only read.

[stripe]
mode = sandbox

[billing]
who = sandbox-who.csv
; nothing in a new sandbox is old, so every "how old" setting is 0 here.
; Leave them out for a real account: the defaults are 365, 90, 7 and 3 days.
old_discount_days = 0
free_days = 0
draft_days = 0
unsent_days = 0

[plans]
team = team_monthly
pro = pro_monthly
