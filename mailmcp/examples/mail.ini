; A mail file: the butler's own mailbox and the owner's. The passwords
; (app passwords) come from the environment variables `secret =` names;
; harness fills them from its stored secrets mail-butler and mail-mine.
utc_offset = +01:00

; the butler's own: it reads, drafts and sends from this address
[butler]
address = butler@example.com
from_name = Butler
imap = imap.fastmail.com:993
smtp = smtp.fastmail.com:465
login = butler@example.com
secret = MAIL_BUTLER
role = own

; the owner's: read without marking anything, and drafts; never sent from
[mine]
address = me@gmail.com
imap = imap.gmail.com:993
login = me@gmail.com
secret = MAIL_MINE
role = mine
folders = INBOX
