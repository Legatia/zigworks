; The home and the car, as /setup home and /setup car write them in
; mcp.ini. homemcp and carcloud are the programs next to harness (or on
; PATH); home.ini and car.ini are in harness's data folder.

; Home Assistant's token is stored with: harness secret add ha
[home]
command = "<homemcp>" "<home file>"
secret = HA_TOKEN:ha
money = home_guarded
amount = home_guarded:none

; Smartcar's application secret is stored with: harness secret add smartcar
[car]
command = "<carcloud>" "<car file>"
secret = SMARTCAR_CLIENT_SECRET:smartcar

; The calendar's app password (or Google's token) is stored with: harness secret add caldav
; Its changes are money tools: asked every time, never from a schedule
[calendar]
command = "<calmcp>" "<calendar file>"
secret = <calendar secret>
money = cal_create, cal_move, cal_cancel, cal_reply
amount = cal_create:none, cal_move:none, cal_cancel:none, cal_reply:none
