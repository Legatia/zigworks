; The butler's triggers: what starts each routine. /setup routines adds
; the sections of the routines you turn on to triggers.ini, with your
; devices in place of the <...> parts (a section naming <leak> or <door>
; once for each leak sensor, door or window). homemcp pushes each change,
; so these run within a second of it, not at the next poll.

; goodnight, at a set time (before quiet hours, so its question rings)
[goodnight-at]
at = <goodnight at>
start = workflow goodnight

; leaving: the last of you went out
[everyone-left]
mcp = home resource home://presence
match = change is everyone_left
start = workflow leaving

; arriving: the first of you is back
[first-home]
mcp = home resource home://presence
match = change is first_home
start = workflow arriving

; the morning summary, as quiet hours end
[morning-home-at]
at = <morning at>
start = workflow morning-home

; a leak: urgent, through quiet hours
[leak-<leak>]
mcp = home resource home://device/<leak>
match = to has leak
start = workflow leak <leak words>
urgent = yes

; smoke or CO: urgent, through quiet hours and to the household; said on
; every speaker when the home has one; nothing is acted on
[smoke-<smoke>]
mcp = home resource home://device/<smoke>
match = to is ALARM
start = workflow smoke <smoke words>
urgent = yes
#if speakers
announce = Smoke alarm: <smoke words>.
speakers = all
#end

; a door or window opened: the routine looks again 10 minutes later
[door-<door>]
mcp = home resource home://device/<door>
match = to is open
start = workflow door-open <Door label>

; the car for tomorrow, in the evening
[car-evening]
at = <car at>
start = workflow car-tomorrow
