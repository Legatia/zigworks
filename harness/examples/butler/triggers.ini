; The butler's triggers: what starts each routine. /setup routines adds
; the sections of the routines you turn on to triggers.ini, with your
; devices in place of the <...> parts (a section naming <leak> or <door>
; once for each leak sensor, door or window). homemcp pushes each change,
; so these run within a second of it, not at the next poll.

; goodnight, at a set time (before quiet hours, so its question rings)
[goodnight-at]
at = <goodnight at>
start = workflow goodnight

; leaving: the last of you went out
[everyone-left]
mcp = home resource home://presence
match = change is everyone_left
start = workflow leaving

; arriving: the first of you is back
[first-home]
mcp = home resource home://presence
match = change is first_home
start = workflow arriving

; the morning summary, as quiet hours end
[morning-home-at]
at = <morning at>
start = workflow morning-home

; a leak: urgent, through quiet hours
[leak-<leak>]
mcp = home resource home://device/<leak>
match = to has leak
start = workflow leak <leak words>
urgent = yes

; smoke or CO: urgent, through quiet hours and to the household; said on
; every speaker when the home has one; nothing is acted on
[smoke-<smoke>]
mcp = home resource home://device/<smoke>
match = to is ALARM
start = workflow smoke <smoke words>
urgent = yes
#if speakers
announce = Smoke alarm: <smoke words>.
speakers = all
#end

; a door or window opened: the routine looks again 10 minutes later
[door-<door>]
mcp = home resource home://device/<door>
match = to is open
start = workflow door-open <Door label>

; away: a door, window or movement while you're away comes at once,
; through quiet hours and to the household (escalate in config.ini), and
; is said on the house's speakers when it has one
[away-<watch>]
mcp = home resource home://device/<watch>
match = to is <watch to>
while = away
urgent = yes
say = <watch line>
tag = no
#if speakers
announce = <watch announce>
#end

; the doorbell while someone is home: a line (and with a speaker, said in
; every room); no camera is ever used
[doorbell-<bell>]
mcp = home resource home://device/<bell>
match = to is ring
while = home
start = workflow doorbell <bell where>
#if speakers
announce = Someone's at <bell where>.
speakers = all
#end

; the doorbell while you're away: at once, through quiet hours, and to
; the household; never a button that unlocks
[doorbell-away-<bell>]
mcp = home resource home://device/<bell>
match = to is ring
while = away
urgent = yes
say = Someone's at <bell where> while you're away{hint}.
tag = no

; the car for tomorrow, in the evening
[car-evening]
at = <car at>
start = workflow car-tomorrow

; the owner's mail (/setup mail mine): bills due in 3 days, read a few
; times a day; each is said once
[bill-due]
mcp = mail/mail_list {"mailbox": "mine", "due_in_days": 3}
every = 6h
key = id
start = workflow bill

; parcels coming today, read through the day; each is said once
[delivery-today]
mcp = mail/mail_list {"mailbox": "mine", "day": "today"}
every = 1h
key = id
start = workflow delivery

; a flight confirmation, as it arrives (mailmcp pushes new mail)
[flight-mail]
mcp = mail resource mail://mine/new
match = kind is travel
start = workflow flight

; an invitation, as it arrives
[invitation-mail]
mcp = mail resource mail://mine/new
match = kind is invitation
start = workflow invitation
