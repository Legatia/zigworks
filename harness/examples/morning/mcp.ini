; The three servers the work morning reads (add to mcp.ini). Sign in or
; store the tokens first: harness mcp login atlassian, harness secret add
; github, harness secret add slack. Then harness mcp list shows each one's
; tools: the morning's steps name them as SERVER/TOOL.

[github]
url = https://api.githubcopilot.com/mcp/
token = github                 ; a stored secret, sent as Authorization: Bearer
header = X-MCP-Toolsets: notifications,issues,pull_requests

[jira]
url = https://mcp.atlassian.com/v1/mcp
login = oauth                  ; sign in once: harness mcp login jira

; Slack: the MCP server you use for it, as a program or at a url; its
; token stored with harness secret add slack, for example:
; [slack]
; command = /usr/local/bin/your-slack-mcp-server
; secret = SLACK_TOKEN:slack
