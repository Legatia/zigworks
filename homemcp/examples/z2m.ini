; The made-up home of homemcp-sim, through Zigbee2MQTT and an MQTT broker:
;   mosquitto -p 1883 &
;   homemcp-sim z2m 127.0.0.1:1883 &
;   homemcp check examples/z2m.ini
; For a real home, list your own devices: `id` is the friendly name you
; gave each one in Zigbee2MQTT.

[home]
name = The flat (made up by homemcp-sim)
hub = zigbee2mqtt
mqtt = 127.0.0.1:1883
base = zigbee2mqtt

[limits]
temperature = 16 24
brightness = 1 100

[device living_room_light]
id = Living room light
kind = light
allow = on, off, brightness

[device kettle]
id = Kettle plug
kind = plug
allow = off
note = it may switch the kettle off, never on: a kettle switched on unattended is a fire risk

[device thermostat]
id = Hall thermostat
kind = climate
allow = temperature, mode
modes = off, heat

[device front_door]
id = Front door
kind = lock
allow = lock
note = it may lock the door; unlocking is not on the list at all

[device garage_door]
id = Garage door
kind = cover
allow = close
guarded = yes

[device water_main]
id = Water main
kind = valve
allow = close
note = for closing the water when there is a leak

[device hall_motion]
id = Hall motion
kind = sensor

[device back_door]
id = Back door
kind = sensor
