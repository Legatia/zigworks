; The made-up home of homemcp-sim, through Zigbee2MQTT and an MQTT broker:
;   mosquitto -p 1883 &
;   homemcp-sim z2m 127.0.0.1:1883 &
;   homemcp check examples/z2m.ini
; For a real home, `homemcp discover mqtt://127.0.0.1:1883` writes a file
; like this one from Zigbee2MQTT's device list: `id` is the friendly name
; you gave each device in Zigbee2MQTT. Zigbee2MQTT has no rooms; add them.

[home]
name = The flat (made up by homemcp-sim)
hub = zigbee2mqtt
mqtt = 127.0.0.1:1883
base = zigbee2mqtt

[limits]
temperature = 16 24
brightness = 1 100
color_temp = 2200 6500

[device living_room_light]
id = Living room light
kind = light
room = Living room
alias = the big light
allow = on, off, brightness

[device bedroom_lamp]
id = Bedroom lamp
kind = light
room = Bedroom
allow = on, off, brightness, color, color_temp

[device kettle]
id = Kettle plug
kind = plug
room = Kitchen
allow = off
note = it may switch the kettle off, never on: a kettle switched on unattended is a fire risk

[device thermostat]
id = Hall thermostat
kind = climate
room = Hall
alias = the heating
allow = temperature, mode
modes = off, heat

[device ceiling_fan]
id = Ceiling fan
kind = fan
room = Bedroom
allow = on, off, speed

[device front_door]
id = Front door
kind = lock
room = Hall
allow = lock
note = it may lock the door; unlocking is not on the list at all

[device garage_door]
id = Garage door
kind = cover
room = Garage
allow = close
guarded = yes

[device water_main]
id = Water main
kind = valve
room = Kitchen
allow = close
note = for closing the water when there is a leak

[device hall_motion]
id = Hall motion
kind = sensor
room = Hall

[device back_door]
id = Back door
kind = sensor
room = Kitchen

[device sink_leak]
id = Sink leak
kind = sensor
room = Kitchen
