; The made-up home of homemcp-sim, as Home Assistant:
;   homemcp-sim ha 8123 not-a-real-token &
;   HA_TOKEN=not-a-real-token homemcp check examples/ha.ini
; For a real home: `url` is your Home Assistant, `id` each device's entity
; id, and HA_TOKEN a long-lived access token (Profile, Security), given to
; homemcp through the environment (in harness: secret = HA_TOKEN:homeassistant).

[home]
name = The flat (made up by homemcp-sim)
hub = homeassistant
url = http://127.0.0.1:8123

[limits]
temperature = 16 24
brightness = 1 100

[device living_room_light]
id = light.living_room
kind = light
allow = on, off, brightness

[device kettle]
id = switch.kettle
kind = plug
allow = off
note = it may switch the kettle off, never on: a kettle switched on unattended is a fire risk

[device thermostat]
id = climate.hall
kind = climate
allow = temperature, mode
modes = off, heat

[device front_door]
id = lock.front_door
kind = lock
allow = lock
note = it may lock the door; unlocking is not on the list at all

[device garage_door]
id = cover.garage_door
kind = cover
allow = close
guarded = yes

[device water_main]
id = valve.water_main
kind = valve
allow = close
note = for closing the water when there is a leak

[device hall_motion]
id = binary_sensor.hall_motion
kind = sensor

[device back_door]
id = binary_sensor.back_door
kind = sensor
