; The made-up home of homemcp-sim, as Home Assistant:
;   homemcp-sim ha 8123 not-a-real-token &
;   HA_TOKEN=not-a-real-token homemcp check examples/ha.ini
; For a real home, `homemcp discover http://your-home-assistant:8123` writes
; a file like this one from your own areas, devices and names. `url` is your
; Home Assistant, `id` each device's entity id, and HA_TOKEN a long-lived
; access token (Profile, Security), given to homemcp through the environment
; (in harness: secret = HA_TOKEN:homeassistant).

[home]
name = The flat (made up by homemcp-sim)
hub = homeassistant
url = http://127.0.0.1:8123
tts = tts.piper                  ; the text-to-speech a media player announces with

[limits]
temperature = 16 24
brightness = 1 100
color_temp = 2200 6500
volume = 0 60

[device living_room_light]
id = light.living_room
kind = light
room = Living room
alias = the big light
allow = on, off, brightness

[device bedroom_lamp]
id = light.bedroom_lamp
kind = light
room = Bedroom
allow = on, off, brightness, color, color_temp

[device kettle]
id = switch.kettle
kind = plug
room = Kitchen
allow = off
note = it may switch the kettle off, never on: a kettle switched on unattended is a fire risk

[device thermostat]
id = climate.hall
kind = climate
room = Hall
alias = the heating
allow = temperature, mode
modes = off, heat

[device ceiling_fan]
id = fan.ceiling_fan
kind = fan
room = Bedroom
allow = on, off, speed

[device kitchen_speaker]
id = media_player.kitchen_speaker
kind = media
room = Kitchen
allow = play, pause, volume, announce

[device hall_voice]
id = assist_satellite.hall_voice
kind = satellite
room = Hall
allow = announce
note = a voice satellite: it says what the announce tool gives it

[device evening]
id = scene.evening
kind = scene
allow = activate

[device leaving]
id = scene.leaving
kind = scene
allow = activate
guarded = yes
note = it also locks the front door, so it is asked about every time

[device front_door]
id = lock.front_door
kind = lock
room = Hall
allow = lock
note = it may lock the door; unlocking is not on the list at all

[device garage_door]
id = cover.garage_door
kind = cover
room = Garage
allow = close
guarded = yes

[device water_main]
id = valve.water_main
kind = valve
room = Kitchen
allow = close
note = for closing the water when there is a leak

[device hall_motion]
id = binary_sensor.hall_motion
kind = sensor
room = Hall

[device back_door]
id = binary_sensor.back_door
kind = sensor
room = Kitchen

[device sink_leak]
id = binary_sensor.sink_leak
kind = sensor
room = Kitchen

[people]
anna = person.anna
ben = person.ben
