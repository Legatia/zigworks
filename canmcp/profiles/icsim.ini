; ICSim, the instrument cluster simulator, on vcan0
; (harness/research/cansim: /opt/cansim/bin/icsim-demo).

[car]
name = ICSim (a simulated instrument cluster)
silent_seconds = 3

[bus can]
interface = vcan0
log = can0
dbc = ../dbc/icsim.dbc

[reading speed]
signal = can SPEED.speed
note = a few km/h of noise while standing

[reading left_indicator]
signal = can INDICATORS.left

[reading right_indicator]
signal = can INDICATORS.right

[reading door1_locked]
signal = can DOORS.door1_locked

[reading door2_locked]
signal = can DOORS.door2_locked

[reading door3_locked]
signal = can DOORS.door3_locked

[reading door4_locked]
signal = can DOORS.door4_locked

; for builds with diagnostic reads (zig build -Ddiag=sim): the made-up
; battery ECU of /opt/cansim/bin/uds-ecu, on the same bus
[diag]
interface = vcan0
pad = aa
