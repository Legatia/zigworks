; Hyundai Ioniq 5 (and other CAN FD Hyundai/Kia/Genesis cars): the E-CAN
; bus as recorded by openpilot in comma.ai's commaCarSegments (bus 1; the
; replays of harness/research/cansim put it on vcan1). Mostly CAN FD frames.
; Signal names from opendbc's hyundai_canfd.dbc (MIT, which IMPORTs
; _hyundai_canfd_common.dbc), fetched by cansim's setup.sh. Battery data on
; these cars is only had by asking the BMS (diagnostic reads), not here.

[car]
name = Hyundai Ioniq 5 (E-CAN)

[bus ecan]
interface = vcan1
log = can1
dbc = /opt/cansim/dbc/hyundai_canfd.dbc
fd = on

[reading wheel_speed_fl]
signal = ecan WHEEL_SPEEDS.WHL_SpdFLVal
unit = km/h

[reading wheel_speed_fr]
signal = ecan WHEEL_SPEEDS.WHL_SpdFRVal
unit = km/h

[reading wheel_speed_rl]
signal = ecan WHEEL_SPEEDS.WHL_SpdRLVal
unit = km/h

[reading wheel_speed_rr]
signal = ecan WHEEL_SPEEDS.WHL_SpdRRVal
unit = km/h

[reading gear]
signal = ecan ACCELERATOR.GEAR

[reading accelerator]
signal = ecan ACCELERATOR.ACCELERATOR_PEDAL

[reading driver_door]
signal = ecan DOORS_SEATBELTS.DRIVER_DOOR

[reading passenger_door]
signal = ecan DOORS_SEATBELTS.PASSENGER_DOOR

[reading driver_seatbelt]
signal = ecan DOORS_SEATBELTS.DRIVER_SEATBELT

[reading left_indicator]
signal = ecan BLINKERS.LEFT_LAMP

[reading right_indicator]
signal = ecan BLINKERS.RIGHT_LAMP

[reading steering_angle]
signal = ecan STEERING_SENSORS.STEERING_ANGLE
unit = deg

[reading driver_braking]
signal = ecan TCS.DriverBraking
