; Tesla Model 3/Y: the "party" bus and its autopilot side, as recorded by
; openpilot in comma.ai's commaCarSegments (bus 0 and bus 2; the replays of
; harness/research/cansim put them on vcan0 and vcan2). Signal names from
; opendbc's tesla_model3_party.dbc (MIT), which cansim's setup.sh fetches.
; On a real car, the party bus is the one Tesla documents for third-party
; devices (connector X181, service bulletin CD-20-17-001); it carries no
; battery data in this DBC.

[car]
name = Tesla Model 3 (party bus)

[bus party]
interface = vcan0
log = can0
dbc = /opt/cansim/dbc/tesla_model3_party.dbc

[bus autopilot]
interface = vcan2
log = can2
dbc = /opt/cansim/dbc/tesla_model3_party.dbc

[reading speed]
signal = party DI_speed.DI_vehicleSpeed
unit = km/h

[reading gear]
signal = party DI_systemStatus.DI_gear

[reading accelerator]
signal = party DI_systemStatus.DI_accelPedalPos

[reading brake]
signal = party ESP_status.ESP_driverBrakeApply

[reading standstill]
signal = party ESP_B.ESP_vehicleStandstillSts

[reading door_open]
signal = party UI_warning.anyDoorOpen

[reading left_blinker]
signal = party UI_warning.leftBlinkerBlinking

[reading right_blinker]
signal = party UI_warning.rightBlinkerBlinking

[reading seatbelt]
signal = party UI_warning.buckleStatus

[reading cruise]
signal = party DI_state.DI_cruiseState

[reading steering_angle]
signal = party EPAS3S_sysStatus.EPAS3S_internalSAS

[reading blind_spot_left]
signal = autopilot DAS_status.DAS_blindSpotRearLeft

[reading blind_spot_right]
signal = autopilot DAS_status.DAS_blindSpotRearRight
